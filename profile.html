       <div class="header-actions">

         <button class="icon-btn" aria-label="Menu">&#9776;</button>

<aside id="menu-drawer" class="menu-drawer">

  </div>
  
  <ul class="drawer-nav">
    <li><a href="#settings">⚙️ Settings</a></li>
    <li><a href="#about">ℹ️ About VibeCheck</a></li>

  </ul>
</aside>
    </header>

    <!-- App Layout Container -->
    <div class="app-layout">
      <!-- Sidebar Nav -->
      <nav class="sidebar-nav">
  <ul>
      <li><a href="index.html" class="nav-link active"><button class="nav-icon-btn"><span class="icon">⌂</span> <span class="nav-text">Home</span></button></a></li>

      <!-- Main Content -->
      <main class="main-content">
        <section class="profile-header">
            <div class="profile-avatar"></div>
            <h2 id="profile-username">@username</h2>
            <p id="profile-location">Johannesburg, SA</p>
        </section>

        <section class="profile-stats">
            <div class="stat-item">
                <span id="saved-vibes-count">0</span>
                <p>Vibes Saved</p>
            </div>
            <div class="stat-item">
                <span id="reviews-count">0</span>
                <p>Reviews</p>
            </div>
            <div class="stat-item">
                <span id="user-city">JHB</span>
                <p>City</p>
            </div>
        </section>
