<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/venueprofile.css">
</head>
<body>
    <!-- Top Header Bar -->
    <header class="top-header">
       <div class="brand-logo">
         <h1>VIBECHECK <span>JHB</span></h1>
       </div>
       <div class="header-actions">
         <button class="icon-btn" aria-label="Favourites">&#x2661;</button>
         <button class="icon-btn" aria-label="Menu">&#9776;</button>
       </div>
    </header>

    <!-- App Layout Container -->
    <div class="app-layout">
      <!-- Sidebar Nav -->
      <nav class="sidebar-nav">
        <ul>
            <li><a href="index.html" class="nav-link"><button class="nav-icon-btn">⌂</button></a></li>
            <li><a href="explore.html" class="nav-link"><button class="nav-icon-btn">◯</button></a></li>
            <li><a href="saved.html" class="nav-link"><button class="nav-icon-btn">◯</button></a></li>
            <li><a href="profile.html" class="nav-link active"><button class="nav-icon-btn">◯</button></a></li>
        </ul>
      </nav>

      <!-- Main Content -->
      <main class="main-content">
        <section class="profile-header">
            <div class="profile-avatar"></div>
            <h2 id="profile-username">@username</h2>
            <p id="profile-location">Johannesburg, SA</p>
        </section>

        <section class="profile-stats">
            <div class="stat-item">
                <span id="saved-vibes-count">0</span>
                <p>Vibes Saved</p>
            </div>
            <div class="stat-item">
                <span id="reviews-count">0</span>
                <p>Reviews</p>
            </div>
            <div class="stat-item">
                <span id="user-city">JHB</span>
                <p>City</p>
            </div>
        </section>
      </main>
    </div>
</body>
</html>
